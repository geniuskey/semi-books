<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 서가에 없는 페이지</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#201c1f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<!--
  Self-contained 404 page shared by every euiyun.com book repo.
  No external CSS/JS, absolute links only: GitHub Pages serves this file at any missing depth.
-->
<style>
:root {
  --bg: #f6f1e9; --bg-elev: #fffaf3; --surface: #eee5d8; --border: #d9cbb8;
  --text: #29231f; --text-dim: #655b52; --text-faint: #807166;
  --accent: #87502b; --accent-soft: rgba(135, 80, 43, .13);
  --wood: #b58358; --wood-dark: #8a5d38; --stamp: #c0392b; --worm: #6aa84f;
  --shadow: 0 1px 2px rgba(57, 37, 22, .05), 0 8px 24px rgba(57, 37, 22, .07);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1919; --bg-elev: #282321; --surface: #332b27; --border: #514239;
    --text: #f5ecdf; --text-dim: #c9b9a8; --text-faint: #a6917f;
    --accent: #ecc18b; --accent-soft: rgba(236, 193, 139, .15);
    --wood: #6b4a33; --wood-dark: #4a3324; --stamp: #ff6b5b; --worm: #8fd16e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1919; --bg-elev: #282321; --surface: #332b27; --border: #514239;
  --text: #f5ecdf; --text-dim: #c9b9a8; --text-faint: #a6917f;
  --accent: #ecc18b; --accent-soft: rgba(236, 193, 139, .15);
  --wood: #6b4a33; --wood-dark: #4a3324; --stamp: #ff6b5b; --worm: #8fd16e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center;
  padding: 16px;
  background: var(--bg); color: var(--text);
  font: 16px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}
main { width: 100%; max-width: 640px; }

/* ---------- shelf ---------- */
.shelf {
  position: relative;
  height: 150px;
  padding: 0 14px;
  display: flex; align-items: flex-end; justify-content: center; gap: 3px;
  border-bottom: 12px solid var(--wood);
  box-shadow: 0 6px 0 -2px var(--wood-dark);
  border-radius: 2px;
}
.spine {
  position: relative;
  flex: 0 0 auto;
  border: 0; padding: 0; margin: 0;
  border-radius: 3px 3px 1px 1px;
  cursor: pointer;
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  box-shadow: inset -3px 0 0 rgba(0, 0, 0, .12), inset 2px 0 0 rgba(255, 255, 255, .12);
}
.spine::before, .spine::after {
  content: ""; position: absolute; left: 3px; right: 3px; height: 2px;
  background: rgba(255, 255, 255, .45); border-radius: 1px;
}
.spine::before { top: 12%; }
.spine::after { bottom: 12%; }
.spine:hover, .spine:focus-visible { transform: translateY(-8px); }
.spine:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spine.pulled { transform: translateY(-34px) rotate(-4deg); }
.spine.found { transform: translateY(-40px) rotate(6deg); }
.spine.wiggle { animation: wiggle .4s; }
@keyframes wiggle { 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }

.gap {
  position: relative; flex: 0 0 64px; height: 100%;
  display: flex; align-items: flex-end;
}
/* the fallen "404" book leaning in the gap */
.fallen {
  position: absolute; left: 2px; bottom: 0;
  width: 26px; height: 112px;
  background: var(--accent); color: var(--bg-elev);
  border-radius: 3px 3px 1px 1px;
  transform-origin: bottom left; transform: rotate(28deg);
  display: grid; place-items: center;
  font: 800 13px/1 var(--mono); letter-spacing: .05em;
  writing-mode: vertical-rl;
  box-shadow: inset -3px 0 0 rgba(0, 0, 0, .15);
  animation: tip 4s ease-in-out infinite;
}
@keyframes tip { 0%, 80%, 100% { transform: rotate(28deg); } 88% { transform: rotate(22deg); } 94% { transform: rotate(30deg); } }

/* bookworm crawling along the shelf */
.worm {
  position: absolute; bottom: -10px; left: 0;
  width: 34px; height: 9px;
  animation: crawl 22s linear infinite;
  pointer-events: auto; cursor: pointer;
  z-index: 2;
}
.worm i {
  position: absolute; bottom: 0; width: 9px; height: 9px; border-radius: 50%;
  background: var(--worm);
  animation: inch .6s ease-in-out infinite;
}
.worm i:nth-child(1) { left: 0; animation-delay: .3s; }
.worm i:nth-child(2) { left: 7px; animation-delay: .2s; }
.worm i:nth-child(3) { left: 14px; animation-delay: .1s; }
.worm i:nth-child(4) { left: 21px; width: 12px; height: 11px; }
.worm i:nth-child(4)::after {
  content: ""; position: absolute; right: 2px; top: 3px; width: 3px; height: 3px;
  border-radius: 50%; background: #1b1919;
}
@keyframes inch { 50% { transform: translateY(-4px); } }
@keyframes crawl {
  0% { left: -40px; }
  100% { left: calc(100% + 10px); }
}
.burp {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  font: 700 12px/1 var(--font); color: var(--text-dim); white-space: nowrap;
  animation: rise 1.2s forwards; pointer-events: none;
}
@keyframes rise { to { opacity: 0; transform: translate(-50%, -22px); } }

/* ---------- copy ---------- */
.head { margin: 20px 0 6px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.code { font: 800 14px/1 var(--mono); color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 6px; }
h1 { margin: 0; font-size: clamp(22px, 5vw, 28px); line-height: 1.25; letter-spacing: -.02em; }
.quip { margin: 0 0 14px; color: var(--text-dim); min-height: 1.55em; }
.quip b { color: var(--text); font-weight: 650; }

/* ---------- catalog card ---------- */
.card {
  position: relative; overflow: hidden;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 12px 16px 12px 22px;
  font-size: 14px;
  background-image: repeating-linear-gradient(transparent 0 26px, var(--accent-soft) 26px 27px);
  background-position: 0 7px;
}
.card::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 1px; background: var(--stamp); opacity: .35; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; }
.card dt { color: var(--text-faint); }
.card dd { margin: 0; color: var(--text); overflow-wrap: anywhere; line-height: 27px; }
.card dt { line-height: 27px; font-size: 13px; }
#callno, #path { font: 13px/27px var(--mono); }
.stamp {
  position: absolute; right: 14px; top: 50%;
  padding: 4px 10px;
  border: 3px double var(--stamp); border-radius: 6px;
  color: var(--stamp); font: 900 18px/1 var(--font); letter-spacing: .12em;
  transform: translateY(-50%) rotate(-14deg) scale(1);
  opacity: .82; mix-blend-mode: multiply;
  animation: thump .5s .5s cubic-bezier(.2, 1.8, .4, 1) both;
  pointer-events: none;
}
:root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
@keyframes thump { from { opacity: 0; transform: translateY(-50%) rotate(-30deg) scale(2.4); } }

/* ---------- actions ---------- */
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 42px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--border);
  background: var(--bg-elev); color: var(--text);
  font: 600 14px/1 var(--font); text-decoration: none; cursor: pointer;
}
.btn[hidden] { display: none; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg-elev); }
.btn.primary:hover { filter: brightness(1.08); color: var(--bg-elev); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { margin: 10px 0 0; font-size: 13px; color: var(--text-faint); }

@media (max-width: 480px) {
  .shelf { height: 124px; padding: 0 6px; }
  .gap { flex-basis: 48px; }
  .fallen { height: 92px; width: 22px; font-size: 11px; }
  .stamp { position: static; display: inline-block; margin-top: 8px; transform: rotate(-6deg); animation: none; }
  .btn { flex: 1 1 auto; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .worm { display: none; }
}
</style>
</head>
<body>
<main>
  <div class="shelf" id="shelf" aria-label="책장: 책을 눌러 사라진 페이지를 찾아보세요">
    <div class="worm" id="worm" title="책벌레" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="head">
    <span class="code">404</span>
    <h1>이 페이지는 서가에 없어요</h1>
  </div>
  <p class="quip" id="quip" aria-live="polite">책벌레가 이 페이지를 먹어 버린 것 같아요.</p>

  <div class="card">
    <dl>
      <dt>청구기호</dt><dd id="callno">404.0 ERR</dd>
      <dt>요청 주소</dt><dd id="path">/</dd>
      <dt>상태</dt><dd id="status">행방불명 · 마지막 목격 알 수 없음</dd>
    </dl>
    <span class="stamp" aria-hidden="true">분 실</span>
  </div>

  <div class="actions">
    <a class="btn primary" id="home" href="/">← 첫 화면으로</a>
    <a class="btn" id="up" href="/" hidden>한 칸 위 서가</a>
    <a class="btn" href="https://books.euiyun.com/library/">전체 책장</a>
    <button class="btn" id="back" type="button" hidden>이전 페이지</button>
  </div>
  <p class="hint">심심하면 책장에서 책을 뽑아 보세요. 사라진 페이지가 어딘가 끼어 있을지도 몰라요.</p>
</main>

<script>
(function () {
  var path = decodeURIComponentSafe(location.pathname) || "/";
  function decodeURIComponentSafe(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  // Deterministic PRNG seeded by the path: every broken URL gets its own shelf.
  var seed = 2166136261;
  for (var i = 0; i < path.length; i++) { seed ^= path.charCodeAt(i); seed = Math.imul(seed, 16777619); }
  function rand() { seed = Math.imul(seed ^ (seed >>> 15), 2246822507) ^ Math.imul(seed ^ (seed >>> 13), 3266489909); return ((seed ^= seed >>> 16) >>> 0) / 4294967296; }

  var colors = ["#8c3b2e", "#2f5d62", "#c49a3a", "#4a5a8a", "#6b4e71", "#3f7a4f", "#a8603a", "#5c6b73", "#9b4d64", "#2e4a3d", "#b07d4f", "#46566e"];
  var titles = [
    "아직 안 쓴 책", "쓰다 만 3장", "목차만 있는 책", "부록의 부록", "반납 연체 287일", "읽은 척하는 법",
    "페이지 번호의 역사", "링크는 왜 끊어지는가", "제2판 (미출간)", "책갈피만 꽂힌 책", "서문이 본문보다 긴 책",
    "주석 모음집", "오탈자 1001", "다음 권에 계속", "사서의 비밀 일기", "URL 오타 사전", "언젠가 읽을 책", "표지만 멋진 책"
  ];
  var misses = [
    "『%s』 — 여기엔 없네요.", "『%s』를 펼쳐 보니 낙서만 가득해요.", "『%s』 사이엔 영수증만 끼어 있어요.",
    "『%s』… 아니, 이것도 아니에요.", "『%s』에서 먼지가 풀풀 납니다.", "『%s』는 책벌레가 이미 다녀갔어요."
  ];
  var quips = [
    "책벌레가 이 페이지를 먹어 버린 것 같아요.",
    "사서가 반납 처리를 깜빡했나 봐요.",
    "이 페이지는 다음 판(版)에 실릴 예정입니다. 아마도요.",
    "시뮬레이터를 너무 세게 돌리다가 페이지가 날아갔어요.",
    "누군가 이 페이지를 책갈피 대신 쓰고 있어요.",
    "주소가 한 글자쯤 어긋난 것 같아요. 오탈자는 우리 모두의 숙적이죠.",
    "이 책은 아직 집필 중이에요. 작가가 커피를 내리러 갔어요.",
    "서가를 정리하다가 자리가 바뀌었을지도 몰라요."
  ];

  document.getElementById("path").textContent = path;
  document.getElementById("callno").textContent = "404." + Math.floor(rand() * 900 + 100) + " " + (path.split("/").filter(Boolean)[0] || "ERR").slice(0, 3).toUpperCase();
  var quipEl = document.getElementById("quip");
  quipEl.textContent = quips[Math.floor(Math.random() * quips.length)];

  // Navigation: parent path (one level up) and history back.
  var parts = location.pathname.split("/").filter(Boolean);
  if (parts.length > 1) {
    var up = document.getElementById("up");
    up.href = "/" + parts.slice(0, -1).join("/") + "/";
    up.hidden = false;
  }
  if (history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) {
    var back = document.getElementById("back");
    back.hidden = false;
    back.addEventListener("click", function () { history.back(); });
  }

  // Build the shelf: books left, the gap with the fallen 404 book, books right.
  var shelf = document.getElementById("shelf");
  var narrow = window.matchMedia("(max-width: 480px)").matches;
  var count = narrow ? 9 : 14;
  var gapAt = Math.floor(count / 2) + Math.floor(rand() * 3) - 1;
  var hidden = Math.floor(rand() * count);
  var tries = 0, found = false;
  var pool = titles.slice();

  for (var n = 0; n < count; n++) {
    if (n === gapAt) {
      var gap = document.createElement("div");
      gap.className = "gap";
      gap.innerHTML = '<div class="fallen" aria-hidden="true">404</div>';
      shelf.appendChild(gap);
    }
    var b = document.createElement("button");
    var title = pool.splice(Math.floor(rand() * pool.length), 1)[0];
    b.type = "button";
    b.className = "spine";
    b.title = title;
    b.setAttribute("aria-label", "책 뽑기: " + title);
    b.style.width = (narrow ? 16 : 20) + Math.floor(rand() * 12) + "px";
    b.style.height = 62 + Math.floor(rand() * 30) + "%";
    b.style.background = colors[Math.floor(rand() * colors.length)];
    b.dataset.title = title;
    b.dataset.idx = n;
    shelf.appendChild(b);
  }

  shelf.addEventListener("click", function (e) {
    var b = e.target.closest(".spine");
    if (!b || found) return;
    tries++;
    shelf.querySelectorAll(".pulled").forEach(function (p) { p.classList.remove("pulled"); });
    if (+b.dataset.idx === hidden) {
      found = true;
      b.classList.add("found");
      document.querySelector(".stamp").textContent = "발 견";
      quipEl.innerHTML = "";
      var strong = document.createElement("b");
      strong.textContent = "찾았다! ";
      quipEl.appendChild(strong);
      quipEl.appendChild(document.createTextNode("『" + b.dataset.title + "』 사이에 끼어 있던 페이지는… 백지였어요. (" + tries + "번 만에 발견)"));
      document.getElementById("status").textContent = "발견됨 · 내용은 백지 · 첫 화면에서 다시 찾아보세요";
      return;
    }
    b.classList.add("pulled");
    quipEl.textContent = misses[tries % misses.length].replace("%s", b.dataset.title);
  });

  // The bookworm burps "404" when poked.
  var worm = document.getElementById("worm");
  worm.addEventListener("click", function () {
    var s = document.createElement("span");
    s.className = "burp";
    s.textContent = "꺽… 404";
    worm.appendChild(s);
    setTimeout(function () { s.remove(); }, 1200);
    quipEl.textContent = "범인을 찾았어요. 책벌레가 시치미를 떼고 있네요.";
  });
})();
</script>
</body>
</html>
